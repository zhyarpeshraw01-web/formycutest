<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170e2b">
  <meta name="description" content="Seven minutes of magic, made for one very special girl. A little offline universe for Nma.">
  <title>NMA — The Little Universe That Loves You</title>
  <link rel="icon" href="assets/star.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script src="personalization.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="#" id="home" aria-label="Return to welcome">NMA<span>✧</span><small>A LITTLE UNIVERSE</small></a>
    <nav class="toolbar" aria-label="Experience settings">
      <button class="icon-button" id="collection-button" aria-label="Open your keepsakes">✧ <span id="star-count">0 / 6</span></button>
      <button class="icon-button" id="music-button" aria-pressed="false">♫ <span>Sound off</span></button>
      <button class="icon-button" id="motion-button" aria-pressed="false">◌ <span>Gentle motion</span></button>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer"><span>MADE OF STARDUST & A LITTLE TOO MUCH LOVE</span><span>FOR <b id="footer-name">NARMOKAKAM</b> ♡</span></footer>
  <div id="announcer" role="status" aria-live="polite" class="sr-only"></div>
  <div id="toast" role="status"></div>
  <div id="flight" aria-hidden="true"><span>✦</span><i>A little closer to the magic…</i></div>
  <dialog id="keepsakes" aria-labelledby="keepsakes-title"><button class="close" aria-label="Close keepsakes">×</button><div id="keepsake-content"></div></dialog>
  <noscript>This little universe needs JavaScript enabled. Open index.html in a web browser with JavaScript turned on.</noscript>
</body>
</html>
